name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  orange-pet-and-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/validate_pet.py
      - name: Verify frozen release contract
        run: |
          test "$(shasum -a 256 shared/pet/bubu-orange/spritesheet.webp | cut -d' ' -f1)" = "9b179850352e7ff69040c55d5d0d87f06247e8651c465a0f2a13df9e97ff866d"
          jq -e '.release == 28 and .panel_version == 36 and (.actions | length) == 11' shared/pet/bubu-orange/qa/release-freeze-v28.json
          jq -e '.release_version == 28 and .panel_version == 36 and .panel.gap_above_visible_pet == 14' shared/pet/bubu-orange/qa/runtime-geometry-lock.json
      - run: ./macos/BubuQuotaPanel/scripts/build.sh
      - name: Verify macOS Universal 2 app and behavior
        run: |
          APP='macos/BubuQuotaPanel/build/橙色卜卜额度面板.app'
          BIN="$APP/Contents/MacOS/OrangeBubuQuotaPanel"
          lipo "$BIN" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = "12.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "36"
          test "$(vtool -show-build "$BIN" | grep -c 'minos 12.3')" -eq 2
          codesign --verify --deep --strict "$APP"
          "$BIN" --print-panel-config | grep 'version=36 marketPricesEnabled=true width=224 height=75'
          BUBU_SHOW_MARKET_PRICES=false "$BIN" --print-panel-config | grep 'version=36 marketPricesEnabled=false width=224 height=53'
          "$BIN" --self-test-placement | grep 'realtime-follow=2/2.*gap=14.0; centerError=0.0'
          "$BIN" --self-test-lifecycle | grep 'pet-double-click=3/3'
          "$BIN" --self-test-task-progress | grep 'completed-hidden=pass.*list=5-truncated'
          "$BIN" --self-test-skin-selection | grep 'project=orange orange=pass'
          "$BIN" --self-test-runtime-geometry | grep 'panel=224x75 gap=14.*uniform-2x=pass'
          "$BIN" --self-test-quota-lightstick | grep 'rewind-no-lightsticks=pass.*chairside-live-no-external-accessories=pass'
      - name: Build and inspect macOS variants
        run: |
          ./scripts/build-macos-release.sh
          test -f dist/Orange-Bubu-macOS-Universal-28.zip
          test -f dist/Orange-Bubu-macOS-Universal-Codex-Only-28.zip
          test ! -e build/release/橙色卜卜-macOS/CODEX-ONLY.txt
          test -e build/release/橙色卜卜-macOS-仅Codex额度/CODEX-ONLY.txt
          test -e build/release/橙色卜卜-macOS/pet/bubu-orange/spritesheet.webp
          test ! -e build/release/橙色卜卜-macOS/pet/bubu-office
          ./scripts/validate-orange-isolation.sh build/release/橙色卜卜-macOS
          ./scripts/validate-orange-isolation.sh build/release/橙色卜卜-macOS-仅Codex额度
          unzip -tq dist/Orange-Bubu-macOS-Universal-28.zip
          unzip -tq dist/Orange-Bubu-macOS-Universal-Codex-Only-28.zip
          ./scripts/privacy-audit.sh
      - run: zsh -n macos/package/*.command macos/BubuQuotaPanel/scripts/*.sh scripts/*.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orange-bubu-macos-28
          if-no-files-found: error
          path: |
            dist/Orange-Bubu-macOS-Universal-28.zip
            dist/Orange-Bubu-macOS-Universal-Codex-Only-28.zip

  orange-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $failed = $false
          @(Get-ChildItem -Path windows -Filter *.ps1 -Recurse) +
            @(Get-Item .\scripts\build-windows-release.ps1) | ForEach-Object {
              $file = $_.FullName
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $failed = $true
                foreach ($parseError in $errors) {
                  Write-Host ("::error file=" + $file + ",line=" + $parseError.Extent.StartLineNumber + ",col=" + $parseError.Extent.StartColumnNumber + "::" + $parseError.ErrorId + ": " + $parseError.Message + " near [" + $parseError.Extent.Text + "]")
                }
              }
            }
          if ($failed) { exit 1 }
      - name: Verify Windows modes, geometry and interactions
        shell: powershell
        run: |
          $panel = ".\windows\BubuQuotaPanel\BubuQuotaPanel.ps1"
          $full = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panel -PrintConfiguration
          if ($LASTEXITCODE -ne 0 -or $full -notmatch 'version=36 marketPricesEnabled=true width=224 height=75') { throw "Unexpected Web3 config: $full" }
          $fullXaml = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panel -ValidateXaml
          if ($LASTEXITCODE -ne 0 -or $fullXaml -notmatch 'height=75 marketRows=Visible.*lightstick=True.*independentDefaultOnly=True') { throw "Web3 XAML validation failed: $fullXaml" }
          $geometry = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panel -ValidateRuntimeGeometry
          if ($LASTEXITCODE -ne 0 -or $geometry -notmatch 'panel=224x75 gap=14.*uniform-2x=pass') { throw "Geometry validation failed: $geometry" }
          $tracking = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panel -ValidateTrackingFilters
          if ($LASTEXITCODE -ne 0 -or $tracking -notmatch 'state-aware-selection=True center-calibration=True drag-center=True.*scale-stability=True pet-double-click=True') { throw "Tracking validation failed: $tracking" }
          $tasks = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panel -ValidateTaskProgress
          if ($LASTEXITCODE -ne 0 -or $tasks -notmatch 'completed-hidden=pass.*list=5-truncated.*running-gif=12x100ms') { throw "Task validation failed: $tasks" }
          $skin = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panel -ValidateSkinSelection
          if ($LASTEXITCODE -ne 0 -or $skin -notmatch 'project=orange orange=True') { throw "Skin validation failed: $skin" }
          $env:BUBU_SHOW_MARKET_PRICES = 'false'
          $standard = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panel -PrintConfiguration
          if ($LASTEXITCODE -ne 0 -or $standard -notmatch 'version=36 marketPricesEnabled=false width=224 height=53') { throw "Unexpected standard config: $standard" }
          $standardXaml = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $panel -ValidateXaml
          if ($LASTEXITCODE -ne 0 -or $standardXaml -notmatch 'height=53 marketRows=Collapsed') { throw "Standard XAML validation failed: $standardXaml" }
          Remove-Item Env:BUBU_SHOW_MARKET_PRICES
      - name: Build and install-test Windows variants
        shell: powershell
        run: |
          .\scripts\build-windows-release.ps1
          $web3Zip = 'dist\Orange-Bubu-Windows-10-11-28.zip'
          $standardZip = 'dist\Orange-Bubu-Windows-10-11-Codex-Only-28.zip'
          if (-not (Test-Path $web3Zip) -or -not (Test-Path $standardZip)) { throw 'Windows v28 ZIP missing' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'orange-bubu-v28'
          Expand-Archive -LiteralPath $standardZip -DestinationPath $extractRoot -Force
          # The Actions runner materializes `run:` as a UTF-8 temporary
          # PowerShell file. Locate the release by its ASCII marker instead
          # of comparing a Chinese directory literal under Windows PS 5.1.
          $stage = @(Get-ChildItem -LiteralPath $extractRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'CODEX-ONLY.txt') })
          if ($stage.Count -ne 1) { throw 'Expected exactly one Codex-only package root' }
          $stage = $stage[0].FullName
          $pet = Join-Path $stage 'pet\bubu-orange'
          if (-not (Test-Path (Join-Path $stage 'CODEX-ONLY.txt'))) { throw 'Codex-only marker missing' }
          if (Test-Path (Join-Path $stage 'pet\bubu-office')) { throw 'Blue pet leaked into Orange package' }
          $manifest = Get-Content -Raw (Join-Path $pet 'pet.json') | ConvertFrom-Json
          if ($manifest.id -ne 'bubu-orange' -or $manifest.spritesheetPath -ne 'spritesheet-win-28.webp') { throw 'Orange manifest mismatch' }
          $atlas = Join-Path $pet $manifest.spritesheetPath
          if ((Get-FileHash -Algorithm SHA256 $atlas).Hash.ToLowerInvariant() -ne '9b179850352e7ff69040c55d5d0d87f06247e8651c465a0f2a13df9e97ff866d') { throw 'Atlas fingerprint mismatch' }
          $testHome = Join-Path $env:RUNNER_TEMP 'orange-bubu-codex-home'
          $env:CODEX_HOME = $testHome
          $env:BUBU_INSTALL_NONINTERACTIVE = '1'
          & (Join-Path $stage 'Install-Bubu.cmd') /petonly
          if ($LASTEXITCODE -ne 0) { throw 'Pet-only install failed' }
          $config = Get-Content -Raw (Join-Path $testHome 'config.toml')
          if ($config -notmatch 'selected-avatar-id\s*=\s*"custom:bubu-orange"') { throw 'Orange Bubu was not selected' }
          Remove-Item Env:CODEX_HOME
          Remove-Item Env:BUBU_INSTALL_NONINTERACTIVE
      - uses: actions/upload-artifact@v4
        with:
          name: orange-bubu-windows-28
          if-no-files-found: error
          path: |
            dist/Orange-Bubu-Windows-10-11-28.zip
            dist/Orange-Bubu-Windows-10-11-Codex-Only-28.zip
